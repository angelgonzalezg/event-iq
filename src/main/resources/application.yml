spring:
  application:
    name: event-iq
  config:
    import: optional:file:.env[.properties]   # loads the .env file at the repository root
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none   # the schema is created by db/schema.sql
  ai:
    google:
      genai:
        api-key: ${AI_API_KEY}
        chat:
          model: ${AI_MODEL:gemini-2.5-flash}   # Spring AI 2.0: no ".options" segment

analytics:
  base-url: ${ANALYTICS_URL:http://localhost:8000}

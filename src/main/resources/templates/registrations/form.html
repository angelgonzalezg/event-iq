<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(title=#{registrations.form.title}, section='new-registration', content=~{::main})}">
<body>
<main>
  <div class="page-header">
    <div>
      <h1 th:text="#{registrations.form.title}">Register an attendee</h1>
      <p class="page-subtitle" th:text="#{registrations.form.subtitle}">The attendee must already exist.</p>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <form th:object="${registration}" th:action="@{/registrations}" method="post" novalidate>
        <div class="mb-3">
          <label class="form-label" for="eventId" th:text="#{registrations.form.event}">Event</label>
          <select class="form-select" id="eventId" th:field="*{eventId}" th:errorclass="is-invalid">
            <option value="" th:text="#{registrations.form.event.choose}">Choose an event</option>
            <option th:each="event : ${events}" th:value="${event.eventId()}"
                    th:text="${event.name() + ' (' + #temporals.format(event.eventDate(), 'yyyy-MM-dd') + ')'}">Java Day</option>
          </select>
          <div class="invalid-feedback" th:errors="*{eventId}">Event is required.</div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="email" th:text="#{registrations.form.email}">Attendee email</label>
          <input class="form-control" id="email" type="email" th:field="*{email}" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:errors="*{email}">Email is required.</div>
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit" th:text="#{registrations.form.save}">Register</button>
          <a class="btn btn-outline-secondary" th:href="@{/events}" th:text="#{registrations.form.cancel}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>

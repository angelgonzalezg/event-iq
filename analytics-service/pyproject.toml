[project]
name = "analytics-service"
version = "0.1.0"
description = "EventIQ analytics service: exploratory analysis, revenue prediction and comment sentiment over the shared Oracle database."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "oracledb==26.0.1",
    "pandas==3.0.6",
    "python-dotenv==1.2.3",
    "scikit-learn==1.9.1",
    "textblob==0.20.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.1.1",
]

# Tests import the service modules (main, prediction, ...) from this folder; see docs/testing.md
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
